<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Groundwork CRM</title>
  <meta name="description" content="Track leads, move deals through the pipeline, and see how sales are going." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E6B5C'/%3E%3Cpath d='M8 22h4v-6H8zM14 22h4V10h-4zM20 22h4v-9h-4z' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Figtree:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body class="is-signed-out">
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/leads" aria-label="Groundwork CRM home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" /><path d="M8 22h4v-6H8zM14 22h4V10h-4zM20 22h4v-9h-4z" /></svg>
      <span>Groundwork</span>
    </a>

    <nav class="tabs" aria-label="Main">
      <a class="tab" href="#/leads" data-route="leads">Leads</a>
      <a class="tab" href="#/pipeline" data-route="pipeline">Pipeline</a>
      <a class="tab" href="#/analytics" data-route="analytics">Analytics</a>
    </nav>

    <div class="topbar-actions">
      <button class="btn btn-primary" type="button" data-action="new-lead" data-edit-only>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
        <span>New lead</span>
      </button>
      <a class="btn btn-icon btn-settings" href="#/settings" data-route-link="settings" data-owner-only hidden aria-label="Settings" title="Settings">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.6 2.2h2.8l.4 2.1c.5.2 1 .5 1.4.8l2-.8 1.4 2.4-1.6 1.4c.1.5.1 1.1 0 1.6l1.6 1.4-1.4 2.4-2-.8c-.4.3-.9.6-1.4.8l-.4 2.1H8.6l-.4-2.1c-.5-.2-1-.5-1.4-.8l-2 .8-1.4-2.4 1.6-1.4a4.6 4.6 0 0 1 0-1.6L3.4 7.1l1.4-2.4 2 .8c.4-.3.9-.6 1.4-.8z" /><circle cx="10" cy="10" r="2.4" /></svg>
      </a>
      <details class="menu">
        <summary class="btn btn-icon" aria-label="Account and data options">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4" /><circle cx="8" cy="8" r="1.4" /><circle cx="13" cy="8" r="1.4" /></svg>
        </summary>
        <div class="menu-panel" role="menu">
          <div class="menu-user" data-api-only hidden><strong data-user-name></strong><span data-user-email></span><span data-user-role></span></div>
          <button type="button" role="menuitem" data-action="password" data-api-only hidden>Change password</button>
          <button type="button" role="menuitem" data-action="export">Export leads as CSV</button>
          <div class="menu-sep" role="separator" data-api-only hidden></div>
          <button type="button" role="menuitem" data-action="logout" data-api-only hidden>Sign out</button>
        </div>
      </details>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <dialog class="drawer" id="drawer" aria-labelledby="drawer-title"></dialog>
  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title"></dialog>
  <div class="toasts" id="toasts" popover="manual" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Groundwork needs JavaScript turned on to run.</p></noscript>
</body>
</html>
